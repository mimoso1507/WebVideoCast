name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OndaCast-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar en Releases (enlace fijo de descarga)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OndaCast.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OndaCast.apk \
            --title "OndaCast - ultima version" \
            --notes "APK listo para instalar en Android. Commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
